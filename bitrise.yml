format_version: "13"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

project_type: flutter

workflows:
  ios-build-m2-pro-large:
    summary: iOS release build on M2 Pro Large (6 cores, 14 GB RAM).
    envs:
      - FLUTTER_VERSION: "3.38.4"
    meta:
      bitrise.io:
        stack: osx-xcode-16.4.x
        machine_type_id: g2.mac.large
    steps:
      - git-clone@8: {}

      - flutter-installer@0:
          inputs:
            - version: $FLUTTER_VERSION

      - script@1:
          title: Set up Firebase config files
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -euo pipefail
                echo "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart
                echo "$GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/GoogleService-Info.plist

      - script@1:
          title: Add dependency overrides
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -euo pipefail
                sed -i '' '/^dependency_overrides:/a\
                  stripe_platform_interface: 12.1.0
                ' pubspec.yaml

      - script@1:
          title: Get Flutter packages
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -euo pipefail
                flutter pub get

      - script@1:
          title: Generate Pigeon code
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -euo pipefail
                flutter pub run pigeon --input pigeon_conf.dart --package_name=medito

      - script@1:
          title: Generate Riverpod code
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -euo pipefail
                dart run build_runner build --delete-conflicting-outputs

      - script@1:
          title: Precache Flutter iOS artifacts
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -euo pipefail
                flutter precache --ios

      - script@1:
          title: Install CocoaPods dependencies
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -euo pipefail
                cd ios && rm -f Podfile.lock && pod install --repo-update

      - flutter-build@0:
          inputs:
            - platform: ios
            - ios_output_type: archive
            - ios_additional_params: >-
                --release
                --no-codesign
                --dart-define=APP_KEY=benchmark
                --dart-define=ENVIRONMENT=prod
                --dart-define=CONTENT_BASE_URL=https://example.com
                --dart-define=AUTH_URL=https://example.com
                --dart-define=EDIT_STATS_URL=https://example.com
                --dart-define=DONATION_BASE_URL=https://example.com
                --dart-define=DONATION_TOKEN=benchmark
                --dart-define=SUPERWALL_API_KEY=benchmark
                --dart-define=PAYWALL_ENV=live
                --dart-define=FACEBOOK_APP_ID=benchmark
                --dart-define=FACEBOOK_CLIENT_TOKEN=benchmark
                --dart-define=ENABLE_DEVICE_PREVIEW=false

      - deploy-to-bitrise-io@2: {}
