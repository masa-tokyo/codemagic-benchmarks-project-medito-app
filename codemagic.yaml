workflows:
  ios-build-m2:
    name: iOS Build (M2)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: 3.41.6
      xcode: 16.4
      groups:
        - firebase_config
    cache:
      cache_paths:
        - ~/.pub-cache
    scripts:
      - name: Set up Firebase config files
        script: |
          echo "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart
          echo "$GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/GoogleService-Info.plist
      - name: Add dependency overrides
        script: |
          sed -i '' '/^dependency_overrides:/a\
            stripe_platform_interface: 12.1.0
          ' pubspec.yaml
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate Pigeon code
        script: flutter pub run pigeon --input pigeon_conf.dart --package_name=medito
      - name: Generate Riverpod code
        script: dart run build_runner build --delete-conflicting-outputs
      - name: Install CocoaPods dependencies
        script: cd ios && rm -f Podfile.lock && pod install --repo-update
      - name: Build iOS (release, no codesign)
        script: |
          flutter build ios --release --no-codesign \
            --dart-define=APP_KEY=benchmark \
            --dart-define=ENVIRONMENT=prod \
            --dart-define=CONTENT_BASE_URL=https://example.com \
            --dart-define=AUTH_URL=https://example.com \
            --dart-define=EDIT_STATS_URL=https://example.com \
            --dart-define=DONATION_BASE_URL=https://example.com \
            --dart-define=DONATION_TOKEN=benchmark \
            --dart-define=SUPERWALL_API_KEY=benchmark \
            --dart-define=PAYWALL_ENV=live \
            --dart-define=FACEBOOK_APP_ID=benchmark \
            --dart-define=FACEBOOK_CLIENT_TOKEN=benchmark \
            --dart-define=ENABLE_DEVICE_PREVIEW=false
    artifacts:
      - build/ios/iphoneos/*.app

