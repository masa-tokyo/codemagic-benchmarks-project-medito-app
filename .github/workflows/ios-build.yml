name: iOS Build

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label"
        required: true
        default: "macos-15"
        type: choice
        options:
          - macos-15
          - macos-14
          - macos-latest

jobs:
  ios-build:
    name: iOS Build (${{ inputs.runner }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.3
        run: |
          if [ -d "/Applications/Xcode_26.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          else
            echo "::warning::Xcode 26.3 not found, listing available versions:"
            ls /Applications/Xcode*.app || true
            echo "Using default Xcode installation."
          fi
          xcodebuild -version

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2.12.0
        with:
          flutter-version: "3.41.6"
          cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Codemagic CLI tools
        run: pip install codemagic-cli-tools

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-cache-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            pub-cache-${{ runner.os }}-

      - name: Set up Firebase config files
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          echo "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart
          echo "$GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/GoogleService-Info.plist

      - name: Get Flutter packages
        run: flutter pub get

      - name: Show Xcode build settings (Codemagic CLI)
        run: xcode-project show-build-settings --workspace ios/Runner.xcworkspace --scheme Runner

      - name: Build iOS (release, no codesign)
        id: build
        run: |
          START=$(date +%s)
          flutter build ios --release --no-codesign \
            --dart-define=APP_KEY=benchmark \
            --dart-define=ENVIRONMENT=prod \
            --dart-define=CONTENT_BASE_URL=https://example.com \
            --dart-define=AUTH_URL=https://example.com \
            --dart-define=EDIT_STATS_URL=https://example.com \
            --dart-define=DONATION_BASE_URL=https://example.com \
            --dart-define=DONATION_TOKEN=benchmark \
            --dart-define=SUPERWALL_API_KEY=benchmark \
            --dart-define=PAYWALL_ENV=live \
            --dart-define=FACEBOOK_APP_ID=benchmark \
            --dart-define=FACEBOOK_CLIENT_TOKEN=benchmark \
            --dart-define=ENABLE_DEVICE_PREVIEW=false
          END=$(date +%s)
          DURATION=$((END - START))
          echo "duration=${DURATION}" >> "$GITHUB_OUTPUT"

      - name: Report build duration
        run: |
          echo "## iOS Build Duration" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Runner | \`${{ inputs.runner }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build time | **${{ steps.build.outputs.duration }}s** |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-${{ inputs.runner }}
          path: build/ios/iphoneos/*.app
